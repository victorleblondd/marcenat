# Proposition de nouveau site pour la commune de Marcenat (Cantal)
# Publié avec GitHub Pages (Jekyll). Voir README.md pour la mise à jour.

title: "Marcenat"
description: "Proposition de nouveau site pour la commune de Marcenat (Cantal, 15190) : mairie, infos et alertes, vie pratique, vie locale et patrimoine."
lang: fr-FR
locale: fr_FR

# Adresse du site. Avec un nom de domaine : url = "https://le-domaine.fr" et baseurl = "".
url: "https://victorleblondd.github.io"
baseurl: "/marcenat"

# Tant que la mairie n'a pas adopté le site :
#   - bandeau « Proposition de nouveau site » en haut de chaque page ;
#   - site non référencé par les moteurs de recherche (balise noindex) ;
#   - mentions légales au nom de l'auteur de la proposition.
# Une fois le site adopté par la commune : passer à false.
proposition: true
site_officiel_actuel: "http://www.marcenat15.fr"

timezone: Europe/Paris
encoding: utf-8

# Les articles du bulletin municipal (dossier _posts) sont publiés sous /bulletin-municipal/nom-de-l-article/
permalink: /bulletin-municipal/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - outils

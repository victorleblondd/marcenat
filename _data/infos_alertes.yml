# =====================================================================
#  INFOS & ALERTES DE LA MAIRIE
#  La publication la plus récente se place TOUT EN HAUT de la liste.
#
#  Ajouter un avis en PDF :
#    1. Déposer le fichier PDF dans le dossier  documents/infos-alertes/
#       Nom conseillé : AAAA-MM-JJ-sujet-court.pdf  (sans accents ni espaces)
#       (ou ajouter son adresse dans outils/fichiers-a-recuperer.txt : voir README.md)
#    2. Copier le modèle ci-dessous tout en haut de la liste, puis le remplir.
#
#  - date: "AAAA-MM-JJ"               date de l'avis
#    heure: "HH:MM"                   facultatif
#    type: alerte                     alerte (rouge) ou info (bleu)
#    theme: eau                       eau, travaux, vie (services et vie locale)
#    titre: "Titre de l'avis"
#    resume: "Une ou deux phrases qui disent l'essentiel."
#    pdf: "AAAA-MM-JJ-sujet-court.pdf"    nom exact du fichier déposé
#    bandeau_jusquau: "AAAA-MM-JJ"    facultatif : bandeau rouge sur l'accueil
#                                     jusqu'à cette date incluse (alertes)
#
#  Champ facultatif « texte » : le texte complet de l'avis (version lisible
#  sans ouvrir le PDF). Les avis sans PDF affichent ce texte.
# =====================================================================

- date: "2026-10-12"
  type: info
  theme: vie
  titre: "Octobre Rose : randonnées solidaires, dimanche 18 octobre"
  resume: "Le Club des aînés ruraux du Cézallier, le Comité des fêtes, Familles rurales et Marche Nat' vous invitent le dimanche 18 octobre, dès 8 h 30, à la Maison des sports de nature. Tous les bénéfices seront reversés à la Ligue contre le cancer."
  pdf: "2026-10-12-octobre-rose-randonnees.pdf"
  texte: |
    <p><strong>Ensemble contre le cancer</strong> : dimanche 18 octobre, à partir de 8 h 30, à la Maison des sports de nature, 30 route du Cézallier.</p>
    <ul>
      <li>exposition d'information sur le cancer du sein ;</li>
      <li>buvette : boissons chaudes et fraîches, vin chaud ;</li>
      <li>trois randonnées à prix libre : la petite, pour découvrir le parcours pédagogique de l'INRAE ; la moyenne, pour flâner sur 7 km ; la grande, pour une belle marche de 14 km ;</li>
      <li>collation offerte ;</li>
      <li>pâtisseries à déguster sur place ou à emporter : gâteaux, gaufres et crêpes maison ;</li>
      <li>tombola.</li>
    </ul>
    <p>Avec le Club des aînés ruraux du Cézallier de Marcenat, le Comité des fêtes, Familles rurales et Marche Nat'. Tous les bénéfices seront reversés à la Ligue contre le cancer.</p>


- date: "2026-10-06"
  type: info
  theme: vie
  titre: "Octobre Rose : collecte de T-shirts tout le mois"
  resume: "Tout au long du mois d'octobre, déposez vos T-shirts propres et en coton, même troués ou tachés : ils seront transformés en bonnets destinés aux personnes atteintes de cancer."
  pdf: "2026-10-06-octobre-rose-collecte-t-shirts.pdf"
  texte: |
    <p>Tout au long du mois d'<strong>octobre 2026</strong>, une collecte de T-shirts est organisée pour une belle action solidaire.</p>
    <p><strong>Quels T-shirts donner ?</strong> Des T-shirts propres et en coton, même s'ils sont troués ou tachés. Ils seront transformés en bonnets destinés aux personnes atteintes de cancer.</p>
    <p><strong>Où les déposer ?</strong></p>
    <ul>
      <li>à la boulangerie ;</li>
      <li>au Relais des Mousquetaires ;</li>
      <li>à la Poste ;</li>
      <li>à la médiathèque ;</li>
      <li>et dans les autres points de collecte participants.</li>
    </ul>
    <p>Un simple T-shirt peut ainsi avoir une seconde vie et devenir un geste de solidarité.</p>


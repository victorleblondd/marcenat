- date: "2026-10-02"
  type: alerte
  theme: eau
  titre: "Alerte sécheresse rouge : restrictions renforcées des usages de l'eau"
  resume: "La situation hydrologique reste très critique. Un nouvel arrêté préfectoral renforce les restrictions des usages de l'eau : les mesures qui s'appliquent à votre adresse sont détaillées sur vigieau.gouv.fr."
  pdf: "2026-10-02-secheresse-alerte-rouge.pdf"
  texte: |
    <p>Malgré les précipitations enregistrées ces derniers jours, la situation hydrologique reste très critique : les pluies sont restées trop faibles et trop localisées pour recharger efficacement les nappes ou soutenir durablement le débit des cours d'eau.</p>
    <p>Après consultation du comité de suivi opérationnel de l'étiage le 8 septembre 2026, le préfet a pris un nouvel arrêté :</p>
    <ul>
      <li>Alagnon, Haut-Allier, Truyère en Ander, affluents du Lot domanial amont, Maronne-Auze, Sumène et Rhue sont classés en <strong>crise</strong> ;</li>
      <li>Truyère en Aubrac, Truyère aval, Célé, Veyre et Cère restent classés en alerte renforcée ;</li>
      <li>la rivière Lot reste en vigilance.</li>
    </ul>
    <p>Le préfet en appelle à la responsabilité de chacun pour maintenir tous les efforts d'économie de la ressource en eau.</p>
    <p>Le détail des mesures est consultable en indiquant votre adresse sur <a href="https://vigieau.gouv.fr/" rel="noopener">vigieau.gouv.fr</a>.</p>


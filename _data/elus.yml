# Conseil municipal : maire et adjoints élus lors de la séance du 20 mars 2026.
# Délégations : arrêtés du maire n° AR_010_2026, AR_011_2026 et AR_012_2026 du 25 mars 2026.
# Permanences : avis de la mairie du 12 mai 2026.

installation: "20 mars 2026"

maire:
  nom: "Philippe Vialle"
  fonction: "Maire"
  mandat: "Conseiller communautaire de Hautes Terres Communauté"
  permanence: "Permanence les lundis, mardis et jeudis, de 9 h 30 à 12 h, avec ou sans rendez-vous."

adjoints:
  - nom: "Thierry Maigne"
    fonction: "1er adjoint"
